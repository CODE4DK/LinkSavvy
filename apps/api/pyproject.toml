[project]
name = "linksavvy-api"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "aiomysql>=0.2.0",
    "aiosmtplib>=3.0",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "email-validator>=2.1",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyjwt>=2.8",
    "pymysql>=1.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "uuid6>=2024.1.12",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "black>=24.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Formatting (E1/E2/E5, line length) is black's job; ruff covers the rest.
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["uuid6.*", "aiosmtplib.*", "argon2.*"]
ignore_missing_imports = true
