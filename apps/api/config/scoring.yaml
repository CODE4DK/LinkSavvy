# The Audit Engine's scoring rules. See docs/scoring.md for the
# plain-language explanation of every component below -- a user must be
# able to read that doc and understand exactly why they scored what they
# scored. Bump scoring_version whenever a weight or mapping changes, so
# score_history rows stay honestly comparable only within one version.
scoring_version: "2026.1"

# Overall = weighted mean of available category scores (app/audit/scoring.py's
# weighted_average). A category with status='skipped' or 'failed'
# contributes no score and its weight is dropped from the denominator
# (renormalized), never silently treated as zero.
category_weights:
  profile: 30
  content: 15
  engagement: 20
  career: 15
  visibility: 20

categories:
  profile:
    components:
      - code: completeness
        weight: 25
        description: >-
          How complete the profile is, reusing Phase 2's completeness score
          (headline, About, experience, skills, certifications/projects all
          present and substantial).
      - code: headline_quality
        weight: 20
        description: >-
          Whether the headline is specific, mentions a value proposition, and
          carries role-relevant keywords, judged by AI against a rubric.
      - code: about_quality
        weight: 20
        description: >-
          Whether the About section has a hook, real substance, a clear
          structure, and a call to action, judged by AI against a rubric.
      - code: experience_quality
        weight: 20
        description: >-
          Whether experience bullets read as achievements (with numbers)
          rather than plain duty statements, judged by AI against a rubric.
      - code: skills_coverage
        weight: 15
        description: >-
          How many of the target role's commonly-expected skills appear in
          the user's skills list.

  content:
    components:
      - code: posting_readiness
        weight: 60
        description: >-
          Whether the user has supplied enough recent post history to judge
          posting consistency and quality. Skipped (not scored against you)
          until you paste or upload some posts.
      - code: content_opportunities
        weight: 40
        description: >-
          How many concrete content angles the user's own experience and
          skills suggest, whether or not they've posted before.

  engagement:
    components:
      - code: network_signals
        weight: 30
        description: >-
          Connections, followers, and recommendations received, when the
          connected LinkedIn API or a manual entry makes them visible.
      - code: contactability
        weight: 30
        description: >-
          Whether the profile invites contact: a custom URL claimed, and an
          About section that closes with a way to reach the person.
      - code: engagement_opportunities
        weight: 40
        description: >-
          Concrete, manual engagement ideas suggested by the user's industry
          and role -- never automation.

  career:
    components:
      - code: resume_presence
        weight: 30
        description: >-
          Whether a resume has been uploaded for cross-referencing. Skipped
          until one is.
      - code: role_alignment
        weight: 50
        description: >-
          Overlap between the user's listed skills and the target role's
          must-have skills (AI generates the expected list once per audit;
          the overlap itself is computed deterministically).
      - code: readiness_gaps
        weight: 20
        description: >-
          Specific, named skills the target role typically expects that are
          missing from the user's own skills list.

  visibility:
    components:
      - code: keyword_density
        weight: 30
        description: >-
          How many of the target role's vocabulary words appear across the
          headline and About section.
      - code: custom_url
        weight: 15
        description: "Whether a custom, memorable LinkedIn URL is claimed."
      - code: profile_metadata
        weight: 20
        description: "Whether industry and location are set -- both are searchable fields."
      - code: skill_alignment
        weight: 20
        description: >-
          Overlap between the user's listed skills and the target role's
          expected skill vocabulary.
      - code: brand_consistency
        weight: 15
        description: >-
          Whether the headline and About section both carry at least some of
          the target role's expected vocabulary, as a proxy for telling a
          consistent professional story.

# The Growth Hub's own scores (Phase 8). Health Score is *not* listed
# here -- it's the Audit Engine's overall score above, surfaced as-is
# with its five categories as sub-scores, so it shares scoring_version
# and category_weights/categories with the rest of this file rather
# than duplicating them. Visibility, Consistency, and Personal Branding
# are new, independent scores -- not categories rolled into one
# overall number -- so each gets its own component list, weighted to
# 100, validated the same way app/audit/scoring.py validates categories
# above (see app/growth/scoring_config.py).
growth:
  scoring_version: "2026.1"
  scores:
    visibility:
      components:
        - code: keyword_coverage
          weight: 25
          description: >-
            How many of the target role's vocabulary words appear across the
            headline, About section, and experience bullets combined --
            broader than the audit's own keyword_density component, which
            only looks at headline + About.
        - code: custom_url
          weight: 10
          description: "Whether a custom, memorable LinkedIn URL is claimed."
        - code: profile_metadata
          weight: 15
          description: "Whether industry and location are set -- both are searchable fields."
        - code: skill_alignment
          weight: 15
          description: >-
            Overlap between the user's listed skills and the target role's
            expected skill vocabulary.
        - code: photo_and_banner
          weight: 15
          description: >-
            Whether a profile photo is set. LinkSavvy doesn't currently
            capture a banner image anywhere in ProfileSnapshot (see ADR
            0009), so this component is photo-only until a later phase adds
            banner capture -- disclosed here rather than silently scored as
            if banner presence were checked.
        - code: recommendations_received
          weight: 20
          description: >-
            Whether the profile shows any received recommendations, when the
            connected LinkedIn API or manual entry makes the count visible.

    consistency:
      components:
        - code: posts_per_week
          weight: 30
          description: >-
            Average recorded posts per week over the trailing 12 weeks,
            scored against a realistic target cadence.
        - code: variance
          weight: 25
          description: >-
            How evenly spread posting is across the 12 weeks -- a steady
            weekly habit scores higher than the same total posts bunched
            into a couple of weeks.
        - code: longest_gap
          weight: 25
          description: "The longest run of consecutive weeks with zero recorded posts."
        - code: streak_length
          weight: 20
          description: "The current run of consecutive weeks with at least one recorded post."

    personal_branding:
      components:
        - code: positioning_clarity
          weight: 25
          description: >-
            Whether a reader could state, in one sentence, who this person is
            and what they do -- judged by AI against a rubric, never a
            fabricated score.
        - code: message_consistency
          weight: 20
          description: >-
            Whether the headline, About, and experience sections tell the
            same professional story rather than pulling in different
            directions.
        - code: distinctiveness
          weight: 20
          description: >-
            Whether the profile says something specific to this person,
            rather than reading like it could describe anyone in the role.
        - code: proof
          weight: 20
          description: >-
            Whether claims (skills, strengths, expertise) are backed by
            concrete evidence -- a result, a project, a number -- somewhere
            in the profile or content.
        - code: content_profile_alignment
          weight: 15
          description: >-
            Whether the themes of the user's own content samples (if any)
            match the positioning claimed in the profile.
