name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  compliance:
    name: LinkedIn compliance guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for scraping/browser-automation/unofficial LinkedIn access
        run: python3 scripts/check_compliance.py

  api:
    name: API (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check .

      - name: Black
        run: uv run black --check .

      - name: Mypy
        run: uv run mypy app scripts tests alembic/env.py

      - name: Pytest
        run: uv run pytest -q

      - name: Bandit (static security analysis)
        run: uv run bandit -c pyproject.toml -r app

      - name: pip-audit (dependency vulnerabilities)
        run: uv run pip-audit

  web:
    name: Web (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # npm workspaces: one lockfile and one node_modules at the repo
      # root, covering apps/web and packages/contracts together.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Vitest
        working-directory: apps/web
        run: npm run test -- --run

      - name: Build
        working-directory: apps/web
        run: npm run build

      # Fails if the initial-load JS chunk grows past its gzip budget --
      # see docs/performance.md "Bundle budget" and scripts/check-bundle-budget.mjs.
      - name: Bundle budget
        working-directory: apps/web
        run: npm run check:bundle-budget

      # Production dependencies only, and only fails on high/critical --
      # see docs/security.md "CI security scanning" for the currently
      # accepted moderate-severity findings (a react-router advisory
      # needing a major-version bump, and dev-only vite/vitest tooling
      # advisories with no production exposure) and their remediation plan.
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t linksavvy-api apps/api

      - name: Build web image
        run: docker build -t linksavvy-web -f apps/web/Dockerfile .
